packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
  - vitest@5.0.3
patchedDependencies:
  '@pdf-lib/fontkit@1.1.1': patches/@pdf-lib__fontkit@1.1.1.patch
overrides:
  # Security advisories (pnpm audit). Transitive deps pinned to patched versions; same major where possible.
  body-parser: '>=2.4.0'
  multer: '>=2.5.0'
  undici: '>=8.12.2'
  source-map-js: '>=1.2.2'
  fast-uri: '>=3.1.9'
  qs: '>=6.16.1'
  mysql2: '>=3.23.1'
