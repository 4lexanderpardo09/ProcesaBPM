name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Draft PRs are not reviewed until they are marked ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Created by `claude /install-github-app` (Claude subscription).
          # With an API key instead, use: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the reviewer of ProcesaBPM, a multi-tenant SaaS. The PR branch is checked out.
            Read CLAUDE.md, docs/arquitectura.md and docs/base-de-datos.md (sections 7 and 8) first,
            then review ONLY the changes of this PR (`gh pr diff`). Report problems, not praise.

            Check, in this order:
            1. Tenant isolation: every query runs inside a transaction with app.tenant_id set; no
               cross-tenant access; composite keys (tenant_id, x_id); RLS enabled on new tables;
               new tenant tables call app_enable_tenant_rls and index every foreign key.
            2. Correctness against the business rules and the "Contrato para el API" (ticket
               lifecycle, SLA clocks and visits, approvers, immutable published versions,
               append-only history, users' sensitive columns never selected).
            3. Security: authorization per record (CASL, deny by default), input validation with
               zod, no interpolated SQL, no secrets in code or logs, HTML sanitized.
            4. Tests: every new rule or use case has unit tests and, when it touches the database
               or HTTP, integration/e2e tests, including a tenant-leak case. Missing tests are an issue.
            5. Architecture and clean code: layers http -> application -> domain / data, no module
               reaching into another module's internals, side effects through the outbox,
               strict TypeScript without `any`, English identifiers, no dead code.
            6. Documentation: docs/ updated when behavior or schema changes.

            Output rules:
            - Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for
              each concrete issue on a specific line, with the fix you propose.
            - Finish with ONE top-level comment via `gh pr comment`, in Spanish, with:
              a verdict (Aprobable / Requiere cambios), the list of blocking issues, and
              non-blocking suggestions. If there are no issues, say so briefly.
            - Never approve, merge or push. Only comment.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
