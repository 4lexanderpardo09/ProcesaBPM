name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @procesabpm/db generate

      - name: Validate Prisma schema
        run: pnpm --filter @procesabpm/db validate

      - name: Typecheck
        run: pnpm -r typecheck

      # Integration tests start PostgreSQL 18 with Testcontainers (Docker is available on GitHub runners).
      - name: Tests
        run: pnpm test

  # The web app in a real browser (Playwright against the production build) and the Storybook build.
  # Its typecheck and unit tests already run in the job above.
  web:
    name: Web E2E and Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @procesabpm/web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm --filter @procesabpm/web test:e2e

      - name: Build Storybook
        run: pnpm --filter @procesabpm/web build-storybook --quiet

      # The website (apps/landing): its build and its pages in a desktop and a phone browser.
      - name: Landing E2E tests
        run: pnpm --filter @procesabpm/landing test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The web against the real API and PostgreSQL 18 (Testcontainers): the httpOnly refresh cookie through the proxy,
  # real rotation with two tabs and the 10-second reuse rule, the MFA enrollment with a real code, and a tenant switch.
  web-stack:
    name: Web E2E against the real API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @procesabpm/db generate

      - name: Install Chromium for Playwright
        run: pnpm --filter @procesabpm/web exec playwright install --with-deps chromium

      - name: E2E tests against the real stack
        run: pnpm --filter @procesabpm/web test:e2e:stack

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stack
          path: apps/web/playwright-report-stack
          retention-days: 7

  # Builds the three production images (never publishes them) and starts them against a real PostgreSQL: the migrations
  # apply, the API answers /api/health and /api/ready, and the worker stops cleanly on SIGTERM (scripts/smoke-images.sh).
  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          load: true
          push: false
          tags: procesabpm-api:ci
          cache-from: type=gha,scope=images-api
          cache-to: type=gha,scope=images-api,mode=max

      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          load: true
          push: false
          tags: procesabpm-worker:ci
          cache-from: type=gha,scope=images-worker
          cache-to: type=gha,scope=images-worker,mode=max

      - name: Build migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          load: true
          push: false
          tags: procesabpm-migrate:ci
          cache-from: type=gha,scope=images-migrate
          cache-to: type=gha,scope=images-migrate,mode=max

      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          load: true
          push: false
          tags: procesabpm-web:ci
          cache-from: type=gha,scope=images-web
          cache-to: type=gha,scope=images-web,mode=max

      - name: Build landing
        uses: docker/build-push-action@v6
        with:
          context: .
          target: landing
          load: true
          push: false
          tags: procesabpm-landing:ci
          cache-from: type=gha,scope=images-landing
          cache-to: type=gha,scope=images-landing,mode=max

      - name: Smoke test the web image
        run: scripts/smoke-web-image.sh
        env:
          WEB_IMAGE: procesabpm-web:ci

      # The image deploy/verify.sh runs on the server: the unit tests of shared and the API inside a 2 GB container.
      - name: Build the unit test image and check it holds the tests
        run: |
          docker build -f Dockerfile.test-unit -t procesabpm-test-unit:ci .
          for package in apps/api packages/shared; do
            docker run --rm --entrypoint sh procesabpm-test-unit:ci -c "test -f $package/vitest.config.ts && find $package/src -name '*.spec.ts' | grep -q ." \
              || { echo "::error::the unit test image has no vitest config or no spec files in $package (is .dockerignore applied to it?)"; exit 1; }
          done

      - name: Run the unit tests in the image
        run: docker run --rm --memory 2g --memory-swap 2g procesabpm-test-unit:ci

      - name: Check the verification and deployment scripts
        run: bash -n deploy/verify.sh && bash -n deploy/deploy.sh

      - name: Smoke test
        run: scripts/smoke-images.sh
        env:
          API_IMAGE: procesabpm-api:ci
          WORKER_IMAGE: procesabpm-worker:ci
          MIGRATE_IMAGE: procesabpm-migrate:ci

      - name: Validate the example compose file
        run: docker compose --env-file deploy/example.env -f docker-compose.prod.example.yml config --quiet
