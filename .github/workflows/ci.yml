name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @procesabpm/db generate

      - name: Validate Prisma schema
        run: pnpm --filter @procesabpm/db validate

      - name: Typecheck
        run: pnpm -r typecheck

      # Integration tests start PostgreSQL 18 with Testcontainers (Docker is available on GitHub runners).
      - name: Tests
        run: pnpm test
